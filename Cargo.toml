[package]
name = "talabulilm"
version = "1.2.0"
edition = "2024"
description = "Watch Ceramah Ustaz (Islamic lectures) from the terminal"
license = "MIT"
repository = "https://github.com/numan89/talabulilm"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "net", "io-util"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
